<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenotypesworld</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 5px; text-align: center; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        .upload-box {
            background: #1e293b;
            border: 2px dashed #38bdf8;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            cursor: pointer;
        }
        #imageInput { display: none; }
        .btn {
            background: #38bdf8;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
        #status { margin-top: 10px; color: #38bdf8; font-weight: 500; font-size: 0.9rem; }
        #preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
        .results { width: 100%; max-width: 500px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
        }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .name { color: #38bdf8; }
        .match { color: #4ade80; }
        .bar-bg { background: #334155; height: 6px; border-radius: 3px; overflow: hidden; }
        .bar-fill { background: #38bdf8; height: 100%; width: 0%; }
        .desc { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
    </style>
</head>
<body>

    <h1>Phenotypesworld</h1>
    <p>Analizator Biometric & Antropologic</p>

    <div class="upload-box" onclick="document.getElementById('imageInput').click()">
        <p>Apasă aici pentru a încărca o fotografie</p>
        <button class="btn">Alege Poză</button>
        <input type="file" id="imageInput" accept="image/*">
        <div id="status">Se încarcă modelele AI...</div>
        <img id="preview" alt="Previzualizare">
    </div>

    <div class="results" id="results"></div>

    <script>
        let loaded = false;
        const status = document.getElementById('status');

        async function init() {
            try {
                const URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
                await faceapi.nets.faceLandmarkTinyNet.loadFromUri(URL);
                loaded = true;
                status.innerText = "Pregătit! Selectează o poză cu fața.";
            } catch (e) {
                status.innerText = "Eroare la încărcarea modelelor.";
            }
        }
        init();

        // Generare bază de date cu 202 variante
        const phenotypes = [];
        const groups = [
            { name: "Nordid", r: 1.42, d: "Leptoprosopic, trăsături înalte și înguste." },
            { name: "Alpinid", r: 1.22, d: "Euryprosopic, cutie craniană rotunjită, proporții compacte." },
            { name: "Dinarid", r: 1.43, d: "Dimensiuni verticale pronunțate, profil nazal proeminent." },
            { name: "Mediteranid", r: 1.37, d: "Structură osoasă gracilă, față îngustă și armonioasă." },
            { name: "Baltid", r: 1.25, d: "Pomeți lați, înălțime facială moderată." },
            { name: "Armenid", r: 1.30, d: "Tendință brahicefală, nas proeminent, înălțime mare." },
            { name: "Turanid", r: 1.34, d: "Amestec de stepă, accent puternic pe pomeți." },
            { name: "Sinid", r: 1.32, d: "Metrică est-asiatică mesoprosopică." }
        ];

        let c = 1;
        groups.forEach(g => {
            ['Classic', 'Sub', 'East', 'West', 'North', 'Robust', 'Gracile', 'Standard', 'Variant'].forEach(m => {
                if (c <= 202) {
                    phenotypes.push({
                        name: `${m} ${g.name} #${c}`,
                        ratio: parseFloat((g.r + (Math.sin(c) * 0.05)).toFixed(3)),
                        desc: `${g.d} Variantă antropologică tipologică cluster ${c}.`
                    });
                    c++;
                }
            });
        });
        while(phenotypes.length < 202) {
            phenotypes.push({
                name: `Global Variant #${phenotypes.length + 1}`,
                ratio: 1.30,
                desc: `Tip standardizat de referință morfologică.`
            });
        }

        const input = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const results = document.getElementById('results');

        input.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !loaded) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                preview.src = event.target.result;
                preview.style.display = 'inline-block';
                status.innerText = "Se analizează geometria facială...";
                results.innerHTML = "";

                setTimeout(async () => {
                    try {
                        const detection = await faceapi.detectSingleFace(preview, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true);
                        
                        if (!detection) {
                            status.innerText = "Nu s-a detectat nicio față clară. Încearcă o poză frontală.";
                            return;
                        }

                        const lm = detection.landmarks;
                        const jaw = lm.getJawOutline();
                        const lEye = lm.getLeftEye();
                        const rEye = lm.getRightEye();

                        const w = Math.abs(jaw[16].x - jaw[0].x);
                        const h = Math.abs(jaw[8].y - (lEye[0].y + rEye[3].y) / 2) * 2;
                        const ratio = w / (h || 1);

                        const scored = phenotypes.map(p => {
                            const diff = Math.abs(p.ratio - ratio);
                            const score = Math.max(65, Math.min(96, Math.round(96 - (diff * 45))));
                            return { ...p, score };
                        }).sort((a, b) => b.score - a.score);

                        status.innerText = "Analiză finalizată!";
                        results.innerHTML = `<h3 style="color:#38bdf8; margin-bottom:5px;">Top Potriviri Antropologice</h3>`;

                        scored.slice(0, 5).forEach(item => {
                            results.innerHTML += `
                                <div class="card">
                                    <div class="card-header">
                                        <span class="name">${item.name}</span>
                                        <span class="match">${item.score}%</span>
                                    </div>
                                    <div class="bar-bg"><div class="bar-fill" style="width: ${item.score}%"></div></div>
                                    <div class="desc">${item.desc}</div>
                                </div>
                            `;
                        });
                    } catch (err) {
                        status.innerText = "Eroare la procesarea biometrică.";
                    }
                }, 400);
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
