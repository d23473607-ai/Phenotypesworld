<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenotypesworld - Biometric Facial Analyzer & 202 Catalog</title>
    <!-- Load face-api.js from CDN for real biometric detection -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-section {
            background: var(--card-bg);
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        #imageInput {
            display: none;
        }

        .upload-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .results-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Phenotypesworld</h1>
        <p>Advanced Anthropological Biometric Facial Analyzer</p>
    </header>

    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <p>Click here or upload a clear facial photograph</p>
        <span class="upload-btn">Browse Image</span>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="results-container" id="resultsContainer">
        <!-- Dynamic analysis results will appear here -->
    </div>

    <script>
        // Placeholder logic for initialization and future extension
        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = document.getElementById('resultsContainer');
                    container.innerHTML = `
                        <div class="card">
                            <h3>Analysis in progress...</h3>
                            <p>Loading biometric descriptors and matching against 202 anthropological varieties.</p>
                            <img src="${e.target.result}" style="max-width:100%; margin-top:15px; border-radius:8px;" alt="Uploaded face"/>
                        </div>
                    `;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
